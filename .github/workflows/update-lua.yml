name: Update Lua

on:
  schedule:
    - cron: '0 9 1 * *'  # First of every month at 09:00 UTC
  workflow_dispatch:

jobs:
  update:
    name: Check for new Lua release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.UPDATE_LUA_TOKEN }}

      - name: Get current Lua version
        id: current
        run: |
          version=$(grep -oP 'project\(lua VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Get latest Lua version
        id: latest
        run: |
          version=$(curl -fsSL https://www.lua.org/ftp/ \
            | grep -oP 'lua-\K[0-9]+\.[0-9]+\.[0-9]+(?=\.tar\.gz)' \
            | sort -V \
            | tail -1)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Download and extract new Lua source
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: |
          VERSION=${{ steps.latest.outputs.version }}
          curl -fsSL "https://www.lua.org/ftp/lua-${VERSION}.tar.gz" -o lua.tar.gz
          tar -xzf lua.tar.gz

          # Replace source files; preserve src/CMakeLists.txt
          find src/ -maxdepth 1 \( -name '*.c' -o -name '*.h' \) -delete
          cp lua-${VERSION}/src/*.c src/
          cp lua-${VERSION}/src/*.h src/

      - name: Update version in CMakeLists.txt
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: |
          VERSION=${{ steps.latest.outputs.version }}
          sed -i "s/project(lua VERSION [0-9]\+\.[0-9]\+\.[0-9]\+/project(lua VERSION ${VERSION}/" CMakeLists.txt

      - name: Open pull request
        if: steps.current.outputs.version != steps.latest.outputs.version
        env:
          GH_TOKEN: ${{ secrets.UPDATE_LUA_TOKEN }}
        run: |
          CURRENT=${{ steps.current.outputs.version }}
          VERSION=${{ steps.latest.outputs.version }}
          BRANCH="lua-update/${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/ CMakeLists.txt
          git commit -m "Update to lua ${VERSION}"
          git push origin "$BRANCH"

          gh pr create \
            --title "Update Lua to ${VERSION}" \
            --body "$(cat <<EOF
          Automated update from Lua ${CURRENT} to ${VERSION}.

          Before merging:
          - Verify that CI passes on all three platforms.
          - Check the [Lua ${VERSION} release notes](https://www.lua.org/bugs.html) for any source-level changes (new or removed files in \`src/\`). If the file lists in \`src/CMakeLists.txt\` need updating, do so before merging.

          Merging this PR will automatically tag \`${VERSION}\` and trigger the release workflow.
          EOF
          )" \
            --base master \
            --head "$BRANCH"
